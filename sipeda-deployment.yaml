apiVersion: apps/v1
kind: Deployment
metadata:
  name: sipeda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sipeda
  template:
    metadata:
      labels:
        app: sipeda
    spec:
      containers:
      - name: sipeda
        image: fdhlteguhamara/sipeda:latest
        ports:
        - containerPort: 80
        env:
        - name: DB_CONNECTION
          value: mysql
        - name: DB_HOST
          value: mysql
        - name: DB_PORT
          value: "3306"
        - name: DB_DATABASE
          value: sipeda
        - name: DB_USERNAME
          value: root
        - name: DB_PASSWORD
          value: root123